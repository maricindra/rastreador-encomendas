<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Drone delivery logo">
  <defs>
    <linearGradient id="droneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E6BE6"/>
      <stop offset="1" stop-color="#1B47B0"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB24D"/>
      <stop offset="1" stop-color="#FF8A1E"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#E8761A"/>
    </linearGradient>
  </defs>

  <!-- Arms -->
  <g stroke="url(#droneBody)" stroke-width="14" stroke-linecap="round">
    <line x1="200" y1="150" x2="110" y2="110"/>
    <line x1="200" y1="150" x2="290" y2="110"/>
  </g>

  <!-- Propellers -->
  <g fill="#4C86F0">
    <ellipse cx="110" cy="100" rx="62" ry="12"/>
    <ellipse cx="290" cy="100" rx="62" ry="12"/>
  </g>
  <g fill="url(#droneBody)">
    <circle cx="110" cy="100" r="16"/>
    <circle cx="290" cy="100" r="16"/>
  </g>

  <!-- Drone body -->
  <rect x="150" y="130" width="100" height="46" rx="23" fill="url(#droneBody)"/>
  <circle cx="200" cy="153" r="12" fill="#AFc9FF"/>

  <!-- Tether lines to package -->
  <g stroke="#1B47B0" stroke-width="6" stroke-linecap="round">
    <line x1="168" y1="176" x2="150" y2="232"/>
    <line x1="232" y1="176" x2="250" y2="232"/>
  </g>

  <!-- Package (isometric box) -->
  <g>
    <!-- top face -->
    <polygon points="200,218 258,246 200,274 142,246" fill="url(#boxTop)"/>
    <!-- left face -->
    <polygon points="142,246 200,274 200,332 142,304" fill="url(#boxFront)"/>
    <!-- right face -->
    <polygon points="258,246 200,274 200,332 258,304" fill="#D4661A"/>
    <!-- tape vertical -->
    <polygon points="200,218 213,224.5 213,282.5 200,276" fill="#FFD9A6" opacity="0.7"/>
    <polygon points="200,218 187,224.5 187,282.5 200,276" fill="#FFE4BF" opacity="0.7"/>
  </g>
</svg>
